name: docutrack2
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.6
  cloud_firestore: ^7.0.0
  firebase_database: ^13.0.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0

dependency_overrides:
  # Avoid the Android JNI registrar mismatch in shared_preferences_android 2.5.0.
  shared_preferences_android: 2.4.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/DocuTrack Logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/DocuTrack Logo.png
  min_sdk_android: 21
